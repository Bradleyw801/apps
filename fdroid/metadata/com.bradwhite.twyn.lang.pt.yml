Name: Twyn Português
Summary: Portuguese for Twyn Keyboard
Description: |
  Portuguese for Twyn Keyboard. Install it next to Twyn, then pick
  Português in Twyn's settings under Look, Language. There's nothing to
  open. Twyn reads its words from it.

  Type ã, ç, é and the rest with their plain letters, and the word comes
  back with them: "nao" gives "não" and "coracao" gives "coração". Where
  Brazil and Portugal spell a word differently, it goes the Brazilian way.
  The screen's keys have Ç after L.

  The words come from the Leipzig Corpora Collection (CC BY 4.0).

RequiresRoot: false

