Name: Twyn Français
Summary: French for Twyn Keyboard
Description: |
  French for Twyn Keyboard 3.4 or later. Install it next to Twyn and
  Twyn switches to French. There's nothing to open: Twyn reads its words
  from it. The mode button at the left of Twyn's bar switches languages.

  Type é, è, à, ç and the rest with their plain letters, and the word
  comes back with them: "ca" gives "ça" and "cest" gives "c'est". The
  screen's keys are AZERTY.

  The words come from the Leipzig Corpora Collection (CC BY 4.0).

RequiresRoot: false

