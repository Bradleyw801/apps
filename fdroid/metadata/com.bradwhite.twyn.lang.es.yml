Name: Twyn Español
Summary: Spanish for Twyn Keyboard
Description: |
  Spanish for Twyn Keyboard. Install it next to Twyn, then pick Español in
  Twyn's settings under Look, Language. There's nothing to open. Twyn
  reads its words from it.

  Type the accents and ñ with their plain letters, and the word comes back
  with them: "manana" gives "mañana". Where a sentence starts, SYM offers
  ¿ and ¡ first, and the screen's keys have Ñ after L.

  The words come from the Leipzig Corpora Collection (CC BY 4.0).

RequiresRoot: false

